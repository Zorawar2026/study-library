<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Library</title>
  <meta name="description" content="Interactive learning modules: deep dives and quick references.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="home">
  <header class="home-head">
    <div class="home-head-inner">
      <div>
        <div class="eyebrow" id="site-owner"></div>
        <h1 id="site-title">Study Library</h1>
        <p class="tagline" id="site-tagline"></p>
      </div>
      <button class="btn btn-ghost btn-sm theme-toggle" type="button"></button>
    </div>
    <div class="home-tools">
      <div class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search modules and terms…  (press / )" aria-label="Search modules and terms" autocomplete="off">
      </div>
      <div class="seg" id="cats" role="group" aria-label="Filter by category"></div>
    </div>
  </header>

  <main class="home-main">
    <div class="home-status" id="status"></div>
    <div class="section-label"><span id="module-count"></span></div>
    <div class="mgrid" id="modules"><div class="loading">Loading modules…</div></div>
    <p class="muted" id="empty" hidden>Nothing matches your search.</p>
    <div id="term-results"></div>
  </main>

  <footer class="site-foot">
    <span>Progress is saved in this browser only.</span>
    <a href="check.html">Content check</a>
  </footer>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
